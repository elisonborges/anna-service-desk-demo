name: Public Demo Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-demo-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate static demo
        run: |
          set -eu
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f anna-symbol.svg
          ! grep -Ei 'dev-login|api-client|DATABASE_URL|JWT_|NEON_|SUPABASE_' index.html
          mkdir -p _site
          cp index.html app.js styles.css anna-symbol.svg robots.txt .nojekyll _site/
          test "$(find _site -type f | wc -l)" -eq 6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
